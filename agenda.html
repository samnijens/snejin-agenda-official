<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snejin Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       SNEJIN AGENDA — GOOGLE CALENDAR STIJL + SEIZOENSTHEMA'S
       ========================================================= */
    :root {
      --bg-glow-1: rgba(168, 199, 250, 0.42);
      --bg-glow-2: rgba(194, 231, 255, 0.54);
      --bg-base-start: #eef5ff;
      --bg-base-mid: #f7faff;
      --bg-base-end: #e9f1fc;
      --surface-header: rgba(248, 250, 253, 0.88);
      --surface-card: rgba(255, 255, 255, 0.94);
      --surface-subtle: rgba(255, 255, 255, 0.78);
      --surface-search: #eaf1fb;
      --surface-search-focus: #ffffff;
      --surface-hover: #eef2f8;
      --surface-active-pill: #c2e7ff;
      --text-active-pill: #001d35;
      --text-primary: #1f1f1f;
      --text-secondary: #444746;
      --text-muted: #5f6368;
      --text-faint: #9aa0a6;
      --border-color: #dadce0;
      --border-soft: rgba(218, 220, 224, 0.78);
      --accent: #0b57d0;
      --accent-hover: #0842a0;
      --accent-soft: #d3e3fd;
      --danger: #c5221f;
      --danger-soft: #fce8e6;
      --today-tint: rgba(11, 87, 208, 0.06);
      --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.07);
      --shadow-fab: 0 3px 8px rgba(15, 23, 42, 0.14), 0 8px 18px rgba(11, 87, 208, 0.12);
      --shadow-modal: 0 24px 54px rgba(15, 23, 42, 0.25);
    }

    /* Seizoensthema's (Licht) */
    body[data-season="spring"] {
      --bg-glow-1: rgba(244, 143, 177, 0.34);
      --bg-glow-2: rgba(165, 214, 167, 0.45);
      --bg-base-start: #f2fbf4;
      --bg-base-mid: #f9fcf9;
      --bg-base-end: #eef7f0;
      --surface-search: #e8f5ea;
      --surface-active-pill: #c8e6c9;
      --text-active-pill: #0d3b1e;
      --accent: #1e7e34;
      --accent-hover: #155d27;
      --accent-soft: rgba(30, 126, 52, 0.14);
      --today-tint: rgba(30, 126, 52, 0.07);
    }

    body[data-season="summer"] {
      --bg-glow-1: rgba(255, 213, 79, 0.42);
      --bg-glow-2: rgba(129, 212, 250, 0.44);
      --bg-base-start: #fffbeb;
      --bg-base-mid: #fdfcf7;
      --bg-base-end: #eef8ff;
      --surface-search: #fff4cc;
      --surface-active-pill: #ffe082;
      --text-active-pill: #3b2500;
      --accent: #0277bd;
      --accent-hover: #01579b;
      --accent-soft: rgba(255, 179, 0, 0.18);
      --today-tint: rgba(255, 179, 0, 0.08);
    }

    body[data-season="autumn"] {
      --bg-glow-1: rgba(255, 167, 86, 0.38);
      --bg-glow-2: rgba(215, 130, 90, 0.34);
      --bg-base-start: #fff5ec;
      --bg-base-mid: #fcf8f5;
      --bg-base-end: #faefe6;
      --surface-search: #fae8d8;
      --surface-active-pill: #ffd8b5;
      --text-active-pill: #3d1d05;
      --accent: #c25917;
      --accent-hover: #99430d;
      --accent-soft: rgba(194, 89, 23, 0.15);
      --today-tint: rgba(194, 89, 23, 0.07);
    }

    body[data-season="winter"] {
      --bg-glow-1: rgba(144, 202, 249, 0.45);
      --bg-glow-2: rgba(207, 216, 220, 0.55);
      --bg-base-start: #edf6ff;
      --bg-base-mid: #f6faff;
      --bg-base-end: #e7f1fa;
      --surface-search: #e3effa;
      --surface-active-pill: #bbdefb;
      --text-active-pill: #0a2a4a;
      --accent: #1565c0;
      --accent-hover: #0d47a1;
      --accent-soft: rgba(21, 101, 192, 0.15);
      --today-tint: rgba(21, 101, 192, 0.07);
    }

    /* Donkere modus + Seizoensthema's */
    body.dark,
    body.dark-mode {
      --bg-glow-1: rgba(11, 87, 208, 0.24);
      --bg-glow-2: rgba(56, 139, 253, 0.14);
      --bg-base-start: #0e1117;
      --bg-base-mid: #131418;
      --bg-base-end: #151923;
      --surface-header: rgba(19, 20, 24, 0.88);
      --surface-card: rgba(30, 31, 34, 0.95);
      --surface-subtle: rgba(30, 31, 34, 0.82);
      --surface-search: #282a2f;
      --surface-search-focus: #30333a;
      --surface-hover: rgba(255, 255, 255, 0.07);
      --surface-active-pill: #004a77;
      --text-active-pill: #c2e7ff;
      --text-primary: #e3e3e3;
      --text-secondary: #c4c7c5;
      --text-muted: #9aa0a6;
      --text-faint: #6e737b;
      --border-color: #35373c;
      --border-soft: rgba(60, 64, 67, 0.65);
      --accent: #a8c7fa;
      --accent-hover: #8ab4f8;
      --accent-soft: rgba(168, 199, 250, 0.16);
      --danger: #f28b82;
      --danger-soft: rgba(242, 139, 130, 0.16);
      --today-tint: rgba(168, 199, 250, 0.08);
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.36);
      --shadow-fab: 0 4px 12px rgba(0, 0, 0, 0.45);
      --shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    body.dark[data-season="spring"],
    body.dark-mode[data-season="spring"] {
      --bg-glow-1: rgba(76, 175, 80, 0.22);
      --bg-glow-2: rgba(240, 98, 146, 0.16);
      --bg-base-start: #0f1712;
      --bg-base-mid: #121714;
      --bg-base-end: #131c16;
      --surface-active-pill: #1b4328;
      --text-active-pill: #b9f6ca;
      --accent: #81c784;
    }

    body.dark[data-season="summer"],
    body.dark-mode[data-season="summer"] {
      --bg-glow-1: rgba(255, 193, 7, 0.22);
      --bg-glow-2: rgba(3, 169, 244, 0.18);
      --bg-base-start: #17150e;
      --bg-base-mid: #141416;
      --bg-base-end: #0f161f;
      --surface-active-pill: #4a3800;
      --text-active-pill: #ffe082;
      --accent: #ffd54f;
    }

    body.dark[data-season="autumn"],
    body.dark-mode[data-season="autumn"] {
      --bg-glow-1: rgba(230, 126, 34, 0.24);
      --bg-glow-2: rgba(160, 82, 45, 0.18);
      --bg-base-start: #1a120d;
      --bg-base-mid: #151312;
      --bg-base-end: #1c1410;
      --surface-active-pill: #4d260b;
      --text-active-pill: #ffcc80;
      --accent: #ffb74d;
    }

    body.dark[data-season="winter"],
    body.dark-mode[data-season="winter"] {
      --bg-glow-1: rgba(66, 165, 245, 0.25);
      --bg-glow-2: rgba(144, 202, 249, 0.16);
      --bg-base-start: #0d141d;
      --bg-base-mid: #11151b;
      --bg-base-end: #0f1924;
      --surface-active-pill: #0d3b66;
      --text-active-pill: #bbdefb;
      --accent: #90caf9;
    }

    /* Zomer zonnegloed overlay */
    .sun-glow-layer {
      position: fixed;
      top: -110px;
      right: -110px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 224, 102, 0.55) 0%, rgba(255, 193, 7, 0.18) 45%, transparent 72%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.4s ease;
      animation: sunPulse 7s ease-in-out infinite;
    }

    body[data-season="summer"] .sun-glow-layer {
      opacity: 1;
    }

    @keyframes sunPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Zwevende seizoensdeeltjes (sneeuwvlokjes, blaadjes, bloemetjes) */
    .season-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .season-particle {
      position: absolute;
      top: -36px;
      user-select: none;
      will-change: transform, opacity;
      animation-name: seasonFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes seasonFall {
      0% {
        transform: translate3d(0, -24px, 0) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.85;
      }
      88% {
        opacity: 0.85;
      }
      100% {
        transform: translate3d(var(--drift-x, 45px), calc(100vh + 48px), 0) rotate(var(--spin-deg, 260deg));
        opacity: 0;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
      width: 100%;
      font-family: "Google Sans", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(circle at 12% 10%, var(--bg-glow-1), transparent 44%),
        radial-gradient(circle at 88% 86%, var(--bg-glow-2), transparent 50%),
        linear-gradient(155deg, var(--bg-base-start) 0%, var(--bg-base-mid) 55%, var(--bg-base-end) 100%);
      background-attachment: fixed;
      transition: background 0.3s ease, color 0.2s ease;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       BOVENSTE BALK (HEADER)
       ========================================================= */
    .gcal-header {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 64px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--surface-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-soft);
    }

    .gcal-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .gcal-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 4px 4px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-primary);
      margin-right: 4px;
    }

    .gcal-brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #4285f4);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 3px 8px rgba(11, 87, 208, 0.22);
    }

    .gcal-brand-text {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .gcal-icon-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      font-size: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .gcal-icon-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .gcal-icon-btn:active {
      transform: scale(0.96);
    }

    .gcal-outlined-btn {
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--surface-card);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .gcal-outlined-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .gcal-nav-arrows {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .gcal-current-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.2px;
      margin-left: 6px;
      white-space: nowrap;
    }

    .gcal-header-center {
      flex: 1 1 200px;
      max-width: 380px;
      min-width: 170px;
    }

    .gcal-search-box {
      height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--surface-search);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .gcal-search-box:focus-within {
      background: var(--surface-search-focus);
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(11, 87, 208, 0.12);
    }

    .gcal-search-box input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
    }

    .gcal-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .gcal-season-select {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--surface-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .gcal-season-select:hover,
    .gcal-season-select:focus {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .gcal-view-switcher {
      display: inline-flex;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface-card);
    }

    .gcal-view-btn {
      height: 34px;
      padding: 0 13px;
      border: none;
      border-right: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .gcal-view-btn:last-child {
      border-right: none;
    }

    .gcal-view-btn:hover {
      background: var(--surface-hover);
    }

    .gcal-view-btn.active {
      background: var(--surface-active-pill);
      color: var(--text-active-pill);
      font-weight: 600;
    }

    .gcal-logout-btn {
      height: 34px;
      padding: 0 14px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--surface-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s ease;
    }

    .gcal-logout-btn:hover {
      background: var(--surface-hover);
    }

    /* =========================================================
       WERKRUIMTE & ZIJLBALK
       ========================================================= */
    .gcal-workspace {
      position: relative;
      z-index: 5;
      display: flex;
      min-height: calc(100vh - 65px);
      width: 100%;
    }

    .gcal-sidebar {
      width: 282px;
      flex-shrink: 0;
      padding: 16px 14px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: width 0.22s ease, padding 0.22s ease, opacity 0.2s ease;
    }

    .gcal-sidebar.collapsed {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .gcal-create-btn {
      height: 54px;
      padding: 0 24px 0 18px;
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      background: var(--surface-card);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      box-shadow: var(--shadow-fab);
      transition: transform 0.15s ease, box-shadow 0.18s ease, background 0.15s ease;
    }

    .gcal-create-btn:hover {
      transform: translateY(-1px);
      background: var(--surface-hover);
    }

    .gcal-plus {
      font-size: 24px;
      line-height: 1;
      color: var(--accent);
      font-weight: 500;
    }

    .gcal-panel {
      background: var(--surface-subtle);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .gcal-mini-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      padding: 0 4px 8px;
    }

    .gcal-mini-arrows {
      display: inline-flex;
      gap: 2px;
    }

    .gcal-mini-arrows button {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .gcal-mini-arrows button:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .gcal-mini-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .gcal-mini-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .gcal-mini-day {
      height: 30px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-primary);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s ease;
    }

    .gcal-mini-day:hover {
      background: var(--surface-hover);
    }

    .gcal-mini-day.muted {
      color: var(--text-faint);
    }

    .gcal-mini-day.today {
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }

    .gcal-mini-day.selected-day:not(.today) {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .gcal-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .gcal-panel-title {
      font-size: 14px;
      font-weight: 600;
    }

    .gcal-mini-add-btn {
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }

    .gcal-mini-add-btn:hover {
      background: var(--accent-soft);
    }

    .gcal-cat-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .gcal-cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      border-radius: 12px;
      padding: 3px 6px;
      transition: background 0.12s ease;
    }

    .gcal-cat-item:hover {
      background: var(--surface-hover);
    }

    .gcal-cat-item.active {
      background: var(--accent-soft);
    }

    .gcal-cat-filter-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 4px;
      text-align: left;
    }

    .gcal-cat-emoji {
      font-size: 15px;
      line-height: 1;
      flex-shrink: 0;
    }

    .gcal-cat-label-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gcal-cat-square {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .gcal-cat-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .gcal-cat-action-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .gcal-cat-action-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .gcal-cat-del-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .gcal-stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .gcal-stat-card {
      background: var(--surface-card);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
    }

    .gcal-stat-card strong {
      display: block;
      font-size: 18px;
      color: var(--accent);
    }

    .gcal-stat-card span {
      font-size: 11px;
      color: var(--text-muted);
    }

    .gcal-quick-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .gcal-text-action {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      padding: 7px 9px;
      border-radius: 9px;
    }

    .gcal-text-action:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    /* =========================================================
       KALENDER VLAK & WEERGAVEN (MAAND / WEEK / DAG / AGENDA)
       ========================================================= */
    .gcal-main {
      flex: 1;
      min-width: 0;
      padding: 16px 16px 20px 0;
    }

    .gcal-calendar-surface {
      background: var(--surface-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-soft);
      border-radius: 24px;
      padding: 16px;
      min-height: calc(100vh - 101px);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
    }

    .month-weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 6px;
    }

    .month-weekday-label {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-auto-rows: minmax(112px, 1fr);
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      flex: 1;
    }

    .month-cell {
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: transparent;
      transition: background 0.12s ease;
      cursor: pointer;
      min-width: 0;
    }

    .month-cell:hover {
      background: var(--surface-hover);
    }

    .month-cell.other-month {
      opacity: 0.45;
    }

    .month-cell.is-today {
      background: var(--today-tint);
    }

    .month-cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .month-day-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .month-cell.is-today .month-day-num {
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }

    .month-events-stack {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .cal-event-chip {
      border: none;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      transition: transform 0.1s ease, filter 0.12s ease;
    }

    .cal-event-chip:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    /* Week- en Dagweergave */
    .timegrid-wrap {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      flex: 1;
    }

    .timegrid-header {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: var(--surface-subtle);
    }

    .timegrid-gutter-head {
      width: 64px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-color);
    }

    .timegrid-days-head {
      display: grid;
      flex: 1;
    }

    .timegrid-day-head {
      padding: 10px 6px;
      text-align: center;
      border-right: 1px solid var(--border-color);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .timegrid-day-head:last-child {
      border-right: none;
    }

    .timegrid-day-head.is-today .tg-head-num {
      background: var(--accent);
      color: #ffffff;
    }

    .tg-head-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin-top: 3px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .timegrid-allday-row {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      min-height: 44px;
      background: rgba(11, 87, 208, 0.02);
    }

    .timegrid-allday-label {
      width: 64px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border-color);
    }

    .timegrid-allday-cols {
      display: grid;
      flex: 1;
    }

    .timegrid-allday-col {
      padding: 4px;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
    }

    .timegrid-allday-col:last-child {
      border-right: none;
    }

    .timegrid-body {
      max-height: 620px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .timegrid-slot-row {
      display: flex;
      min-height: 44px;
      border-bottom: 1px solid var(--border-color);
    }

    .timegrid-slot-row:last-child {
      border-bottom: none;
    }

    .timegrid-time-label {
      width: 64px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 8px 0 0;
      text-align: right;
      border-right: 1px solid var(--border-color);
    }

    .timegrid-slot-cols {
      display: grid;
      flex: 1;
    }

    .timegrid-slot-cell {
      border-right: 1px solid var(--border-color);
      padding: 2px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .timegrid-slot-cell:last-child {
      border-right: none;
    }

    .timegrid-slot-cell:hover {
      background: var(--surface-hover);
    }

    /* Agenda lijstweergave */
    .agenda-list-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agenda-list-empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .agenda-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--surface-subtle);
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .agenda-list-item:hover {
      transform: translateY(-1px);
      background: var(--surface-hover);
    }

    .agenda-list-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .agenda-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .agenda-item-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .agenda-item-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .agenda-item-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .agenda-open-btn {
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--surface-card);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .agenda-open-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* =========================================================
       MODALS / DIALOGEN
       ========================================================= */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(4px);
    }

    .modal.open {
      display: flex;
    }

    .gcal-dialog {
      position: relative;
      width: 100%;
      max-width: 470px;
      border-radius: 24px;
      background: var(--surface-card);
      border: 1px solid var(--border-soft);
      color: var(--text-primary);
      padding: 24px;
      box-shadow: var(--shadow-modal);
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      font-size: 22px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }

    .gcal-dialog-title {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-right: 34px;
    }

    .gcal-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .gcal-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .gcal-field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .gcal-title-input {
      width: 100%;
      border: none;
      border-bottom: 2px solid var(--accent);
      background: transparent;
      padding: 8px 4px;
      font-size: 18px;
      font-weight: 500;
      outline: none;
    }

    .gcal-field input[type="text"],
    .gcal-field input[type="date"],
    .gcal-field input[type="time"],
    .gcal-field select,
    .gcal-field textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      background: var(--surface-subtle);
      outline: none;
    }

    .gcal-field input:focus,
    .gcal-field select:focus,
    .gcal-field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .gcal-field input[type="color"] {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 2px 6px;
      background: var(--surface-subtle);
    }

    .emoji-picker-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .emoji-preset-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border-color);
      border-radius: 9px;
      background: var(--surface-subtle);
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .emoji-preset-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .gcal-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .gcal-check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      width: fit-content;
    }

    .gcal-dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .gcal-btn-primary {
      height: 38px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
    }

    body.dark .gcal-btn-primary,
    body.dark-mode .gcal-btn-primary {
      color: #0f172a;
    }

    .gcal-btn-primary:hover {
      background: var(--accent-hover);
    }

    .gcal-btn-secondary {
      height: 38px;
      padding: 0 16px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
    }

    .gcal-btn-secondary:hover {
      background: var(--accent-soft);
    }

    .gcal-view-top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }

    .gcal-inline-close {
      position: static;
    }

    .gcal-danger-icon:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .gcal-view-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .gcal-color-swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .gcal-view-title {
      font-size: 20px;
      font-weight: 600;
    }

    .gcal-view-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .gcal-view-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gcal-view-line {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .gcal-view-desc-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    #toast-message {
      position: fixed;
      bottom: 24px;
      left: 24px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #1f1f1f;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #toast-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    #toast-message.error {
      background: #b3261e;
    }

    #toast-message.success {
      background: #0f5132;
    }

    @media (max-width: 920px) {
      .gcal-workspace {
        flex-direction: column;
      }

      .gcal-sidebar {
        width: 100%;
        padding: 12px 14px 4px;
      }

      .gcal-sidebar.collapsed {
        width: 100%;
        height: 0;
        padding: 0;
      }

      .gcal-main {
        padding: 10px 12px 18px;
      }

      .month-grid {
        grid-auto-rows: minmax(86px, 1fr);
      }
    }

    @media (max-width: 600px) {
      .gcal-row-2 {
        grid-template-columns: 1fr;
      }

      .gcal-current-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="sun-glow-layer" aria-hidden="true"></div>
  <div id="seasonParticles" class="season-particles" aria-hidden="true"></div>

  <!-- Bovenste balk -->
  <header class="gcal-header">
    <div class="gcal-header-left">
      <button id="toggleSidebarBtn" type="button" class="gcal-icon-btn" title="Zijbalk in- of uitklappen" aria-label="Zijbalk in- of uitklappen">
        ☰
      </button>

      <a href="#top" id="brandHomeLink" class="gcal-brand">
        <span class="gcal-brand-badge">S</span>
        <span class="gcal-brand-text">Snejin Agenda</span>
      </a>

      <button id="gcalTodayBtn" type="button" class="gcal-outlined-btn">
        Vandaag
      </button>

      <div class="gcal-nav-arrows">
        <button id="gcalPrevBtn" type="button" class="gcal-icon-btn" title="Vorige periode" aria-label="Vorige periode">
          ‹
        </button>
        <button id="gcalNextBtn" type="button" class="gcal-icon-btn" title="Volgende periode" aria-label="Volgende periode">
          ›
        </button>
      </div>

      <h1 id="gcalCurrentTitle" class="gcal-current-title">November 2026</h1>
    </div>

    <div class="gcal-header-center">
      <div class="gcal-search-box">
        <span aria-hidden="true">🔍</span>
        <input
          id="search"
          type="search"
          placeholder="Zoeken in Snejin Agenda..."
          aria-label="Zoeken in Snejin Agenda"
        />
      </div>
    </div>

    <div class="gcal-header-right">
      <select id="seasonSelect" class="gcal-season-select" title="Seizoensthema kiezen" aria-label="Seizoensthema kiezen">
        <option value="auto">🌦️ Auto seizoen</option>
        <option value="spring">🌸 Lente</option>
        <option value="summer">☀️ Zomer</option>
        <option value="autumn">🍂 Herfst</option>
        <option value="winter">❄️ Winter</option>
      </select>

      <div class="gcal-view-switcher" role="group" aria-label="Weergave kiezen">
        <button type="button" class="gcal-view-btn" data-view="day">Dag</button>
        <button type="button" class="gcal-view-btn" data-view="week">Week</button>
        <button type="button" class="gcal-view-btn active" data-view="month">Maand</button>
        <button type="button" class="gcal-view-btn" data-view="agenda">Agenda</button>
      </div>

      <button id="themeButton" type="button" class="gcal-icon-btn" title="Donkere modus wisselen" aria-label="Donkere modus wisselen">
        🌙
      </button>

      <button id="logoutButton" type="button" class="gcal-logout-btn">
        Uitloggen
      </button>
    </div>
  </header>

  <!-- Hoofdwerkruimte -->
  <div class="gcal-workspace">
    <aside id="gcalSidebar" class="gcal-sidebar">
      <button id="addEventButton" type="button" class="gcal-create-btn">
        <span class="gcal-plus">+</span>
        <span>Maken</span>
      </button>

      <!-- Mini-kalender -->
      <section class="gcal-panel" aria-label="Mini-kalender">
        <div class="gcal-mini-header">
          <span id="miniCalMonthLabel">November 2026</span>
          <div class="gcal-mini-arrows">
            <button id="miniPrevMonth" type="button" aria-label="Vorige maand">‹</button>
            <button id="miniNextMonth" type="button" aria-label="Volgende maand">›</button>
          </div>
        </div>
        <div class="gcal-mini-weekdays">
          <span>M</span><span>D</span><span>W</span><span>D</span><span>V</span><span>Z</span><span>Z</span>
        </div>
        <div id="miniCalGrid" class="gcal-mini-grid"></div>
      </section>

      <!-- Mijn categorieën -->
      <section class="gcal-panel" aria-label="Mijn categorieën">
        <div class="gcal-panel-header">
          <h2 class="gcal-panel-title">Mijn categorieën</h2>
          <button id="openCategoryModalBtn" type="button" class="gcal-mini-add-btn" title="Nieuwe categorie aanmaken">
            + Nieuw
          </button>
        </div>
        <ul id="categoryList" class="gcal-cat-list"></ul>
      </section>

      <!-- Overzicht & Snelacties -->
      <section class="gcal-panel" aria-label="Overzicht en snelacties">
        <div class="gcal-panel-header">
          <h2 class="gcal-panel-title">Overzicht</h2>
          <span id="activeSeasonBadge" style="font-size:12px;color:var(--text-muted);font-weight:600;"></span>
        </div>
        <div class="gcal-stats-row">
          <div class="gcal-stat-card">
            <strong id="statTotalEvents">0</strong>
            <span>Afspraken</span>
          </div>
          <div class="gcal-stat-card">
            <strong id="statUpcomingWeek">0</strong>
            <span>Deze week</span>
          </div>
        </div>
        <div class="gcal-quick-actions">
          <button id="showAllCategoriesBtn" type="button" class="gcal-text-action">
            Alle categorieën weergeven
          </button>
        </div>
      </section>
    </aside>

    <main class="gcal-main">
      <div class="gcal-calendar-surface">
        <div id="calendarViewContainer"></div>
      </div>
    </main>
  </div>

  <!-- Modal: Afspraak aanmaken of wijzigen -->
  <div id="eventModal" class="modal" aria-hidden="true">
    <div class="gcal-dialog" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <button id="closeFormX" class="modal-close" type="button" aria-label="Sluiten">&times;</button>
      <h2 id="formTitle" class="gcal-dialog-title">Nieuwe afspraak</h2>

      <div class="gcal-form">
        <div class="gcal-field">
          <input id="eventTitle" type="text" class="gcal-title-input" placeholder="Titel toevoegen" required />
        </div>

        <div class="gcal-row-2">
          <div class="gcal-field">
            <label for="eventDate">Datum</label>
            <input id="eventDate" type="date" required />
          </div>
          <div class="gcal-field">
            <label for="eventTime">Tijd</label>
            <input id="eventTime" type="time" />
          </div>
        </div>

        <label class="gcal-check">
          <input id="allDay" type="checkbox" checked />
          <span>Hele dag</span>
        </label>

        <div class="gcal-row-2">
          <div class="gcal-field">
            <label for="eventType">Categorie</label>
            <select id="eventType"></select>
          </div>
          <div class="gcal-field">
            <label for="eventRepeat">Herhalen</label>
            <select id="eventRepeat">
              <option value="none">Niet herhalen</option>
              <option value="weekly">Wekelijks (4 weken)</option>
              <option value="monthly">Maandelijks (3 maanden)</option>
            </select>
          </div>
        </div>

        <div class="gcal-field">
          <label for="eventDescription">Omschrijving / Locatie / Notities</label>

  <!-- Modal: Afspraak bekijken / wijzigen / gereed / verwijderen -->
  <div id="eventViewModal" class="modal" aria-hidden="true">

      <div class="gcal-view-top-actions">

          <span>🕐</span>
          <span id="viewTime">-</span>

          <span id="viewCategoryEmoji">🏷️</span>
          <span id="viewCategoryName">-</span>
        </div>
        <div class="gcal-view-desc-box">
          <p id="viewDescription">Geen omschrijving beschikbaar.</p>
        </div>

        <button id="closeViewButton" type="button" class="gcal-btn-primary">Sluiten</button>
      </div>
