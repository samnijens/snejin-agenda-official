  <div id="toast-message" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const STORAGE_EVENTS_KEY = "snejin_agenda_events_v2";
      const STORAGE_CATS_KEY = "snejin_agenda_cats_v2";
      const STORAGE_THEME_KEY = "snejin_agenda_theme_v2";
      const STORAGE_SEASON_KEY = "snejin_agenda_season_pref_v1";

      const DEFAULT_CATEGORIES = {
        work: { id: "work", label: "Werken", color: "#0B57D0", emoji: "💼", isDefault: true },
        holiday: { id: "holiday", label: "Vakantie", color: "#0F9D58", emoji: "🌴", isDefault: true },
        activity: { id: "activity", label: "Activiteit", color: "#1A73E8", emoji: "⚡", isDefault: true },
        birthday: { id: "birthday", label: "Verjaardag", color: "#E37400", emoji: "🎂", isDefault: true },
        holidayofficial: { id: "holidayofficial", label: "Feestdag", color: "#9334E6", emoji: "🎉", isDefault: true }
      };

      const SEED_EVENTS = [
        {
          id: "seed-1",
          title: "Teamoverleg Snejin",
          description: "Weekplanning en voortgang doornemen.",
          date: "2026-11-24",
          time: "10:00",
          allDay: false,
          category: "work"
        },
        {
          id: "seed-2",
          title: "Verjaardag Anna",
          description: "Koffie en taart 's middags.",
          date: "2026-11-26",
          time: "",
          allDay: true,
          category: "birthday"
        },
        {
          id: "seed-3",
          title: "Hardlopen in het park",
          description: "Rustige duurloop van 7 km.",
          date: "2026-11-25",
          time: "18:00",
          allDay: false,
          category: "activity"
        },
        {
          id: "seed-4",
          title: "Vakantie plannen",
          description: "Data en bestemmingen bekijken.",
          date: "2026-11-28",
          time: "",
          allDay: true,
          category: "holiday"
        }
      ];

      let categories = {};
      let events = [];
      let currentView = "month";
      let anchorDate = new Date(2026, 10, 24);
      let miniCalMonth = new Date(2026, 10, 1);
      let activeCategoryFilter = "all";
      let searchQuery = "";
      let editingEventId = null;
      let viewingEventId = null;
      let editingCategoryId = null;
      let seasonPref = "auto";

      function detectSeasonFromDate(dateObj) {
        const m = dateObj.getMonth(); // 0 = jan .. 11 = dec
        if (m === 11 || m === 0 || m === 1) return "winter";
        if (m >= 2 && m <= 4) return "spring";
        if (m >= 5 && m <= 7) return "summer";
        return "autumn";
      }

      function getEffectiveSeason() {
        if (seasonPref && seasonPref !== "auto") return seasonPref;
        return detectSeasonFromDate(new Date());
      }

      function renderSeasonEffects(season) {
        const layer = document.getElementById("seasonParticles");
        const badge = document.getElementById("activeSeasonBadge");
        if (!layer) return;

        const labels = {
          spring: "🌸 Lente",
          summer: "☀️ Zomer",
          autumn: "🍂 Herfst",
          winter: "❄️ Winter"
        };
        if (badge) {
          badge.textContent = labels[season] || "";
        }

        layer.innerHTML = "";

        if (season === "summer") {
          // In de zomer vooral zonnegloed (geen vallende deeltjes nodig)
          return;
        }

        const particleGlyphs = {
          winter: ["❄️", "❅", "❆"],
          spring: ["🌸", "🌷", "🌼"],
          autumn: ["🍂", "🍁"]
        };
        const glyphs = particleGlyphs[season] || [];
        const count = season === "winter" ? 18 : 12;

        for (let i = 0; i < count; i++) {
          const span = document.createElement("span");
          span.className = "season-particle";
          span.textContent = glyphs[i % glyphs.length];

          const leftPct = Math.round(((i * 7.7) + (i % 3) * 5.5) % 98);
          const duration = 11 + (i % 7) * 2.2;
          const delay = -((i * 1.9) % duration);
          const sizePx = season === "winter" ? 13 + (i % 4) * 3 : 16 + (i % 4) * 3;
          const drift = (i % 2 === 0 ? 1 : -1) * (28 + (i % 5) * 14);
          const spin = season === "winter" ? 140 : (i % 2 === 0 ? 320 : -320);

          span.style.left = `${leftPct}%`;
          span.style.fontSize = `${sizePx}px`;
          span.style.animationDuration = `${duration}s`;
          span.style.animationDelay = `${delay}s`;
          span.style.setProperty("--drift-x", `${drift}px`);
          span.style.setProperty("--spin-deg", `${spin}deg`);

          layer.appendChild(span);
        }
      }

      function applySeasonTheme() {
        const effective = getEffectiveSeason();
        document.body.setAttribute("data-season", effective);
        const selectEl = document.getElementById("seasonSelect");
        if (selectEl && selectEl.value !== seasonPref) {
          selectEl.value = seasonPref;
        }
        renderSeasonEffects(effective);
      }

      function loadCategories() {
        categories = {};
        Object.entries(DEFAULT_CATEGORIES).forEach(([k, v]) => {
          categories[k] = { ...v };
        });

        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_CATS_KEY) || "null");
          if (saved && typeof saved === "object") {
            Object.entries(saved).forEach(([id, cat]) => {
              if (cat && cat.label && cat.color) {
                categories[id] = {
                  id,
                  label: String(cat.label),
                  color: String(cat.color),
                  emoji: String(cat.emoji || "⚡"),
                  isDefault: false
                };
              }
            });
          }
        } catch (err) {
          console.warn("Kon categorieën niet laden:", err);
        }
      }

      function saveCustomCategories() {
        const customOnly = {};
        Object.entries(categories).forEach(([id, cat]) => {
          if (!cat.isDefault) {
            customOnly[id] = {
              id: cat.id,
              label: cat.label,
              color: cat.color,
              emoji: cat.emoji || "⚡",
              isDefault: false
            };
          }
        });
        localStorage.setItem(STORAGE_CATS_KEY, JSON.stringify(customOnly));
      }

      function loadEvents() {
        try {
          const raw = localStorage.getItem(STORAGE_EVENTS_KEY);
          if (raw === null) {
            events = SEED_EVENTS.map((ev) => ({ ...ev }));
            saveEvents();
          } else {
            const parsed = JSON.parse(raw);
            events = Array.isArray(parsed) ? parsed : [];
          }
        } catch (err) {
          console.warn("Kon afspraken niet laden:", err);
          events = SEED_EVENTS.map((ev) => ({ ...ev }));
        }
      }

      function saveEvents() {
        localStorage.setItem(STORAGE_EVENTS_KEY, JSON.stringify(events));
      }

      function formatDateISO(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function parseISODate(isoStr) {
        const [y, m, d] = String(isoStr || "").split("-").map(Number);
        if (!y || !m || !d) return new Date(2026, 10, 24);
        return new Date(y, m - 1, d);
      }

      function isSameDay(d1, d2) {
        return (
          d1.getFullYear() === d2.getFullYear() &&
          d1.getMonth() === d2.getMonth() &&
          d1.getDate() === d2.getDate()
        );
      }

      function getStartOfWeekMonday(date) {
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const offset = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - offset);
        return d;
      }

      function capitalizeFirst(str) {
        if (!str) return "";
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function getHeaderTitle() {
        if (currentView === "month") {
          const txt = new Intl.DateTimeFormat("nl-NL", { month: "long", year: "numeric" }).format(anchorDate);
          return capitalizeFirst(txt);
        }
        if (currentView === "day") {
          const txt = new Intl.DateTimeFormat("nl-NL", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }).format(anchorDate);
          return capitalizeFirst(txt);
        }
        if (currentView === "week") {
          const start = getStartOfWeekMonday(anchorDate);
          const end = new Date(start);
          end.setDate(start.getDate() + 6);
          const startLabel = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "short" }).format(start);
          const endLabel = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "short", year: "numeric" }).format(end);
          return `${startLabel} – ${endLabel}`;
        }
        const txt = new Intl.DateTimeFormat("nl-NL", { month: "long", year: "numeric" }).format(anchorDate);
        return `Agenda · ${capitalizeFirst(txt)}`;
      }

      function getFilteredEvents() {
        const q = searchQuery.trim().toLowerCase();
        return events.filter((ev) => {
          const catMatch = activeCategoryFilter === "all" || ev.category === activeCategoryFilter;
          const titleMatch = (ev.title || "").toLowerCase().includes(q);
          const descMatch = (ev.description || "").toLowerCase().includes(q);
          const searchMatch = !q || titleMatch || descMatch;
          return catMatch && searchMatch;
        });
      }

      function getCategoryMeta(catId) {
        return (
          categories[catId] ||
          categories.activity || { id: "activity", label: "Activiteit", color: "#1A73E8", emoji: "⚡" }
        );
      }

      function showMessage(text, type) {
        const toast = document.getElementById("toast-message");
        if (!toast) return;
        toast.textContent = text;
        toast.className = "";
        if (type === "error") toast.classList.add("error");
        if (type === "success") toast.classList.add("success");
        void toast.offsetWidth;
        toast.classList.add("show");
        clearTimeout(showMessage._timer);
        showMessage._timer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2800);
      }

      function openModal(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.add("open");
        el.setAttribute("aria-hidden", "false");
      }

      function closeModal(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove("open");
        el.setAttribute("aria-hidden", "true");
      }

      function renderCategoryUI() {
        const selectEl = document.getElementById("eventType");
        const listEl = document.getElementById("categoryList");

        if (selectEl) {
          const prevVal = selectEl.value;
          selectEl.innerHTML = "";
          Object.values(categories).forEach((cat) => {
            const opt = document.createElement("option");
            opt.value = cat.id;
            opt.textContent = `${cat.emoji ? cat.emoji + " " : ""}${cat.label}`;
            selectEl.appendChild(opt);
          });
          if (prevVal && categories[prevVal]) {
            selectEl.value = prevVal;
          } else if (categories.activity) {
            selectEl.value = "activity";
          }
        }

        if (listEl) {
          listEl.innerHTML = "";
          Object.values(categories).forEach((cat) => {
            const li = document.createElement("li");
            li.className = "gcal-cat-item" + (activeCategoryFilter === cat.id ? " active" : "");

            const filterBtn = document.createElement("button");
            filterBtn.type = "button";
            filterBtn.className = "gcal-cat-filter-btn";

            const swatch = document.createElement("span");
            swatch.className = "gcal-cat-square";
            swatch.style.backgroundColor = cat.color;

            const emojiSpan = document.createElement("span");
            emojiSpan.className = "gcal-cat-emoji";
            emojiSpan.textContent = cat.emoji || "⚡";

            const labelSpan = document.createElement("span");
            labelSpan.className = "gcal-cat-label-text";
            labelSpan.textContent = cat.label;

            filterBtn.appendChild(swatch);
            filterBtn.appendChild(emojiSpan);
            filterBtn.appendChild(labelSpan);
            filterBtn.addEventListener("click", () => {
              activeCategoryFilter = activeCategoryFilter === cat.id ? "all" : cat.id;
              renderCategoryUI();
              renderAll();
            });

            li.appendChild(filterBtn);

            const actions = document.createElement("div");
            actions.className = "gcal-cat-actions";

            const editBtn = document.createElement("button");
            editBtn.type = "button";
            editBtn.className = "gcal-cat-action-btn";
            editBtn.title = `Categorie '${cat.label}' bewerken`;
            editBtn.setAttribute("aria-label", `Categorie ${cat.label} bewerken`);
            editBtn.textContent = "✏️";
            editBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              openEditCategoryModal(cat.id);
            });
            actions.appendChild(editBtn);

            if (!cat.isDefault) {
              const delBtn = document.createElement("button");
              delBtn.type = "button";
              delBtn.className = "gcal-cat-action-btn gcal-cat-del-btn";
              delBtn.title = `Categorie '${cat.label}' verwijderen`;
              delBtn.setAttribute("aria-label", `Categorie ${cat.label} verwijderen`);
              delBtn.textContent = "×";
              delBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                deleteCategory(cat.id);
              });
              actions.appendChild(delBtn);
            }

            li.appendChild(actions);
            listEl.appendChild(li);
          });
        }
      }

      function openNewCategoryModal() {
        editingCategoryId = null;
        document.getElementById("categoryModalTitle").textContent = "Nieuwe categorie";
        document.getElementById("newCategoryName").value = "";
        document.getElementById("newCategoryEmoji").value = "⚡";
        document.getElementById("newCategoryColor").value = "#0B57D0";
        openModal("categoryModal");
        setTimeout(() => document.getElementById("newCategoryName")?.focus(), 40);
      }

      function openEditCategoryModal(catId) {
        const cat = categories[catId];
        if (!cat) return;
        editingCategoryId = cat.id;
        document.getElementById("categoryModalTitle").textContent = "Categorie bewerken";
        document.getElementById("newCategoryName").value = cat.label;
        document.getElementById("newCategoryEmoji").value = cat.emoji || "⚡";
        document.getElementById("newCategoryColor").value = cat.color || "#0B57D0";
        openModal("categoryModal");
        setTimeout(() => document.getElementById("newCategoryName")?.focus(), 40);
      }

      function saveCategoryFromModal() {
        const nameInput = document.getElementById("newCategoryName");
        const emojiInput = document.getElementById("newCategoryEmoji");
        const colorInput = document.getElementById("newCategoryColor");

        const label = (nameInput?.value || "").trim();
        const emoji = (emojiInput?.value || "").trim() || "⚡";
        const color = colorInput?.value || "#0B57D0";

        if (!label) {
          showMessage("Vul een naam in voor de categorie.", "error");
          nameInput?.focus();
          return;
        }

        if (editingCategoryId && categories[editingCategoryId]) {
          categories[editingCategoryId] = {
            ...categories[editingCategoryId],
            label,
            emoji,
            color
          };
          saveCustomCategories();
          renderCategoryUI();
          renderAll();
          closeModal("categoryModal");
          editingCategoryId = null;
          showMessage(`Categorie "${label}" bijgewerkt.`, "success");
          return;
        }

        const slug =
          "custom_" +
          label
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "_")
            .replace(/^_|_$/g, "") +
          "_" +
          Date.now().toString().slice(-4);

        categories[slug] = {
          id: slug,
          label,
          emoji,
          color,
          isDefault: false
        };

        saveCustomCategories();
        renderCategoryUI();
        closeModal("categoryModal");
        if (nameInput) nameInput.value = "";
        showMessage(`Categorie "${emoji} ${label}" toegevoegd.`, "success");
      }

      function deleteCategory(catId) {
        const cat = categories[catId];
        if (!cat) return;
        if (cat.isDefault) {
          showMessage("Standaard categorieën kunnen niet worden verwijderd.", "error");
          return;
        }
        delete categories[catId];
        saveCustomCategories();
        events.forEach((ev) => {
          if (ev.category === catId) {
            ev.category = "activity";
          }
        });
        saveEvents();
        if (activeCategoryFilter === catId) {
          activeCategoryFilter = "all";
        }
        renderCategoryUI();
        renderAll();
        showMessage(`Categorie "${cat.label}" verwijderd.`, "success");
      }

      function renderMiniCalendar() {
        const labelEl = document.getElementById("miniCalMonthLabel");
        const gridEl = document.getElementById("miniCalGrid");
        if (!labelEl || !gridEl) return;

        const year = miniCalMonth.getFullYear();
        const month = miniCalMonth.getMonth();
        const formatted = new Intl.DateTimeFormat("nl-NL", { month: "long", year: "numeric" }).format(
          new Date(year, month, 1)
        );
        labelEl.textContent = capitalizeFirst(formatted);

        const firstDay = new Date(year, month, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevMonthDays = new Date(year, month, 0).getDate();
        const realToday = new Date();

        gridEl.innerHTML = "";

        for (let i = startOffset - 1; i >= 0; i--) {
          const dayNum = prevMonthDays - i;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "gcal-mini-day muted";
          btn.textContent = String(dayNum);
          btn.addEventListener("click", () => {
            anchorDate = new Date(year, month - 1, dayNum);
            miniCalMonth = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
            renderAll();
          });
          gridEl.appendChild(btn);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const current = new Date(year, month, d);
          const btn = document.createElement("button");
          btn.type = "button";
          let cls = "gcal-mini-day";
          if (isSameDay(current, realToday)) cls += " today";
          else if (isSameDay(current, anchorDate)) cls += " selected-day";
          btn.className = cls;
          btn.textContent = String(d);
          btn.addEventListener("click", () => {
            anchorDate = new Date(year, month, d);
            renderAll();
          });
          gridEl.appendChild(btn);
        }

        const total = gridEl.children.length;
        const tail = total % 7 === 0 ? 0 : 7 - (total % 7);
        for (let n = 1; n <= tail; n++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "gcal-mini-day muted";
          btn.textContent = String(n);
          btn.addEventListener("click", () => {
            anchorDate = new Date(year, month + 1, n);
            miniCalMonth = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
            renderAll();
          });
          gridEl.appendChild(btn);
        }
      }

      function createEventChip(ev) {
        const meta = getCategoryMeta(ev.category);
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "cal-event-chip";
        chip.style.backgroundColor = meta.color;
        const emojiPrefix = meta.emoji ? `${meta.emoji} ` : "";
        const timePrefix = !ev.allDay && ev.time ? `${ev.time} ` : "";
        chip.textContent = `${emojiPrefix}${timePrefix}${ev.title}`;
        chip.title = `${emojiPrefix}${timePrefix}${ev.title} (${meta.label})`;
        chip.addEventListener("click", (e) => {
          e.stopPropagation();
          openViewModal(ev.id);
        });
        return chip;
      }

      function renderMonthView(container, filteredEvents) {
        const weekdaysRow = document.createElement("div");
        weekdaysRow.className = "month-weekdays";
        ["Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"].forEach((w) => {
          const lbl = document.createElement("div");
          lbl.className = "month-weekday-label";
          lbl.textContent = w;
          weekdaysRow.appendChild(lbl);
        });
        container.appendChild(weekdaysRow);

        const grid = document.createElement("div");
        grid.className = "month-grid";

        const year = anchorDate.getFullYear();
        const month = anchorDate.getMonth();
        const firstOfMonth = new Date(year, month, 1);
        const startOffset = (firstOfMonth.getDay() + 6) % 7;
        const gridStart = new Date(year, month, 1 - startOffset);
        const realToday = new Date();

        for (let i = 0; i < 42; i++) {
          const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
          const iso = formatDateISO(cellDate);
          const isOtherMonth = cellDate.getMonth() !== month;
          const isToday = isSameDay(cellDate, realToday);

          const cell = document.createElement("div");
          cell.className =
            "month-cell" +
            (isOtherMonth ? " other-month" : "") +
            (isToday ? " is-today" : "");

          const top = document.createElement("div");
          top.className = "month-cell-top";
          const numSpan = document.createElement("span");
          numSpan.className = "month-day-num";
          numSpan.textContent = String(cellDate.getDate());
          top.appendChild(numSpan);
          cell.appendChild(top);

          const stack = document.createElement("div");
          stack.className = "month-events-stack";

          const dayEvents = filteredEvents.filter((ev) => ev.date === iso);
          dayEvents.forEach((ev) => {
            stack.appendChild(createEventChip(ev));
          });

          cell.appendChild(stack);
          cell.addEventListener("click", () => {
            openFormModal(iso);
          });

          grid.appendChild(cell);
        }

        container.appendChild(grid);
      }

      function renderTimeGridView(container, daysList, filteredEvents) {
        const colCount = daysList.length;
        const realToday = new Date();

        const wrap = document.createElement("div");
        wrap.className = "timegrid-wrap";

        const header = document.createElement("div");
        header.className = "timegrid-header";
        const gutterHead = document.createElement("div");
        gutterHead.className = "timegrid-gutter-head";
        header.appendChild(gutterHead);

        const daysHead = document.createElement("div");
        daysHead.className = "timegrid-days-head";
        daysHead.style.gridTemplateColumns = `repeat(${colCount}, minmax(0, 1fr))`;

        daysList.forEach((d) => {
          const dh = document.createElement("div");
          dh.className = "timegrid-day-head" + (isSameDay(d, realToday) ? " is-today" : "");
          const wk = new Intl.DateTimeFormat("nl-NL", { weekday: "short" }).format(d);
          dh.innerHTML = `<div>${capitalizeFirst(wk)}</div><div class="tg-head-num">${d.getDate()}</div>`;
          daysHead.appendChild(dh);
        });
        header.appendChild(daysHead);
        wrap.appendChild(header);

        const alldayRow = document.createElement("div");
        alldayRow.className = "timegrid-allday-row";
        const alldayLabel = document.createElement("div");
        alldayLabel.className = "timegrid-allday-label";
        alldayLabel.textContent = "Hele dag";
        alldayRow.appendChild(alldayLabel);

        const alldayCols = document.createElement("div");
        alldayCols.className = "timegrid-allday-cols";
        alldayCols.style.gridTemplateColumns = `repeat(${colCount}, minmax(0, 1fr))`;

        daysList.forEach((d) => {
          const iso = formatDateISO(d);
          const col = document.createElement("div");
          col.className = "timegrid-allday-col";
          const dayAllDay = filteredEvents.filter((ev) => ev.date === iso && ev.allDay);
          dayAllDay.forEach((ev) => col.appendChild(createEventChip(ev)));
          col.addEventListener("click", () => openFormModal(iso, "", true));
          alldayCols.appendChild(col);
        });
        alldayRow.appendChild(alldayCols);
        wrap.appendChild(alldayRow);

        const body = document.createElement("div");
        body.className = "timegrid-body";

        for (let hour = 7; hour <= 21; hour++) {
          const hh = String(hour).padStart(2, "0");
          const slotLabelStr = `${hh}:00`;
          const row = document.createElement("div");
          row.className = "timegrid-slot-row";

          const tLbl = document.createElement("div");
          tLbl.className = "timegrid-time-label";
          tLbl.textContent = slotLabelStr;
          row.appendChild(tLbl);

          const slotCols = document.createElement("div");
          slotCols.className = "timegrid-slot-cols";
          slotCols.style.gridTemplateColumns = `repeat(${colCount}, minmax(0, 1fr))`;

          daysList.forEach((d) => {
            const iso = formatDateISO(d);
            const cell = document.createElement("div");
            cell.className = "timegrid-slot-cell";

            const matching = filteredEvents.filter((ev) => {
              if (ev.date !== iso || ev.allDay) return false;
              const evHour = parseInt((ev.time || "00:00").split(":")[0], 10);
              return evHour === hour;
            });
            matching.forEach((ev) => cell.appendChild(createEventChip(ev)));

            cell.addEventListener("click", () => {
              openFormModal(iso, slotLabelStr, false);
            });
            slotCols.appendChild(cell);
          });

          row.appendChild(slotCols);
          body.appendChild(row);
        }

        wrap.appendChild(body);
        container.appendChild(wrap);
      }

      function renderAgendaListView(container, filteredEvents) {
        const listWrap = document.createElement("div");
        listWrap.className = "agenda-list-wrap";

        const sorted = [...filteredEvents].sort((a, b) => {
          const keyA = `${a.date} ${a.allDay ? "00:00" : a.time || "23:59"}`;
          const keyB = `${b.date} ${b.allDay ? "00:00" : b.time || "23:59"}`;
          return keyA.localeCompare(keyB);
        });

        if (sorted.length === 0) {
          const empty = document.createElement("div");
          empty.className = "agenda-list-empty";
          empty.textContent = "Geen afspraken gevonden voor dit filter.";
          listWrap.appendChild(empty);
          container.appendChild(listWrap);
          return;
        }

        sorted.forEach((ev) => {
          const meta = getCategoryMeta(ev.category);
          const item = document.createElement("div");
          item.className = "agenda-list-item";

          const left = document.createElement("div");
          left.className = "agenda-list-left";

          const dot = document.createElement("span");
          dot.className = "agenda-dot";
          dot.style.backgroundColor = meta.color;

          const textBlock = document.createElement("div");
          const titleEl = document.createElement("div");
          titleEl.className = "agenda-item-title";
          titleEl.textContent = `${meta.emoji ? meta.emoji + " " : ""}${ev.title}`;

          const dateObj = parseISODate(ev.date);
          const datePretty = capitalizeFirst(
            new Intl.DateTimeFormat("nl-NL", {
              weekday: "long",
              day: "numeric",
              month: "long",
              year: "numeric"
            }).format(dateObj)
          );
          const timePretty = ev.allDay ? "Hele dag" : ev.time || "Tijd niet opgegeven";

          const metaEl = document.createElement("div");
          metaEl.className = "agenda-item-meta";
          metaEl.textContent = `${datePretty} · ${timePretty} · ${meta.label}`;

          textBlock.appendChild(titleEl);
          textBlock.appendChild(metaEl);

          if (ev.description) {
            const descEl = document.createElement("div");
            descEl.className = "agenda-item-desc";
            descEl.textContent = ev.description;
            textBlock.appendChild(descEl);
          }

          left.appendChild(dot);
          left.appendChild(textBlock);

          const openBtn = document.createElement("button");
          openBtn.type = "button";
          openBtn.className = "agenda-open-btn";
          openBtn.textContent = "Bekijken";
          openBtn.addEventListener("click", () => openViewModal(ev.id));

          item.appendChild(left);
          item.appendChild(openBtn);
          listWrap.appendChild(item);
        });

        container.appendChild(listWrap);
      }

      function updateStats() {
        const totalEl = document.getElementById("statTotalEvents");
        const weekEl = document.getElementById("statUpcomingWeek");
        if (totalEl) {
          totalEl.textContent = String(events.length);
        }
        if (weekEl) {
          const weekStart = getStartOfWeekMonday(anchorDate);
          const weekEnd = new Date(weekStart);
          weekEnd.setDate(weekStart.getDate() + 7);
          const startIso = formatDateISO(weekStart);
          const endIso = formatDateISO(weekEnd);
          const countWeek = events.filter((ev) => ev.date >= startIso && ev.date < endIso).length;
          weekEl.textContent = String(countWeek);
        }
      }

      function renderCalendarView() {
        const container = document.getElementById("calendarViewContainer");
        const titleEl = document.getElementById("gcalCurrentTitle");
        if (!container) return;

        if (titleEl) {
          titleEl.textContent = getHeaderTitle();
        }

        document.querySelectorAll(".gcal-view-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.view === currentView);
        });

        container.innerHTML = "";
        const filtered = getFilteredEvents();

        if (currentView === "month") {
          renderMonthView(container, filtered);
        } else if (currentView === "week") {
          const monday = getStartOfWeekMonday(anchorDate);
          const weekDays = [];
          for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            weekDays.push(d);
          }
          renderTimeGridView(container, weekDays, filtered);
        } else if (currentView === "day") {
          renderTimeGridView(container, [new Date(anchorDate)], filtered);
        } else {
          renderAgendaListView(container, filtered);
        }
      }

      function renderAll() {
        miniCalMonth = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
        renderMiniCalendar();
        renderCalendarView();
        updateStats();
      }

      function updateTimeFieldState() {
        const allDayCheckbox = document.getElementById("allDay");
        const timeInput = document.getElementById("eventTime");
        if (!allDayCheckbox || !timeInput) return;
        timeInput.disabled = allDayCheckbox.checked;
        if (allDayCheckbox.checked) {
          timeInput.value = "";
        } else if (!timeInput.value) {
          timeInput.value = "09:00";
        }
      }

      function openFormModal(dateIso, timeStr, forceAllDay) {
        editingEventId = null;
        document.getElementById("formTitle").textContent = "Nieuwe afspraak";
        document.getElementById("eventTitle").value = "";
        document.getElementById("eventDate").value = dateIso || formatDateISO(anchorDate);
        document.getElementById("eventDescription").value = "";
        document.getElementById("eventRepeat").value = "none";

        const typeSelect = document.getElementById("eventType");
        if (typeSelect) {
          if (activeCategoryFilter !== "all" && categories[activeCategoryFilter]) {
            typeSelect.value = activeCategoryFilter;
          } else if (categories.activity) {
            typeSelect.value = "activity";
          }
        }

        const allDayCheckbox = document.getElementById("allDay");
        const timeInput = document.getElementById("eventTime");

        if (forceAllDay === true || !timeStr) {
          allDayCheckbox.checked = true;
          timeInput.value = "";
          timeInput.disabled = true;
        } else {
          allDayCheckbox.checked = false;
          timeInput.disabled = false;
          timeInput.value = timeStr;
        }

        openModal("eventModal");
        setTimeout(() => document.getElementById("eventTitle")?.focus(), 40);
      }

      function saveEventFromModal() {
        const title = (document.getElementById("eventTitle")?.value || "").trim();
        const date = document.getElementById("eventDate")?.value || "";
        const time = document.getElementById("eventTime")?.value || "";
        const allDay = Boolean(document.getElementById("allDay")?.checked);
        const category = document.getElementById("eventType")?.value || "activity";
        const repeat = document.getElementById("eventRepeat")?.value || "none";
        const description = (document.getElementById("eventDescription")?.value || "").trim();

        if (!title) {
          showMessage("Vul een titel in voor de afspraak.", "error");
          document.getElementById("eventTitle")?.focus();
          return;
        }
        if (!date) {
          showMessage("Kies een geldige datum.", "error");
          return;
        }
        if (!allDay && !time) {
          showMessage("Kies een tijd of vink 'Hele dag' aan.", "error");
          return;
        }

        if (editingEventId) {
          const idx = events.findIndex((e) => e.id === editingEventId);
          if (idx !== -1) {
            events[idx] = {
              ...events[idx],
              title,
              date,
              time: allDay ? "" : time,
              allDay,
              category,
              description
            };
          }
          saveEvents();
          closeModal("eventModal");
          anchorDate = parseISODate(date);
          renderAll();
          showMessage("Afspraak bijgewerkt.", "success");
          return;
        }

        const baseDate = parseISODate(date);
        const occurrences = repeat === "weekly" ? 4 : repeat === "monthly" ? 3 : 1;

        for (let i = 0; i < occurrences; i++) {
          const occDate = new Date(baseDate);
          if (repeat === "weekly") {
            occDate.setDate(baseDate.getDate() + i * 7);
          } else if (repeat === "monthly") {
            occDate.setMonth(baseDate.getMonth() + i);
          }

          events.push({
            id: `ev-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 6)}`,
            title,
            date: formatDateISO(occDate),
            time: allDay ? "" : time,
            allDay,
            category,
            description
          });
        }

        saveEvents();
        closeModal("eventModal");
        anchorDate = baseDate;
        renderAll();
        showMessage(
          occurrences > 1 ? `${occurrences} herhalende afspraken opgeslagen.` : "Afspraak opgeslagen.",
          "success"
        );
      }

      function openViewModal(eventId) {
        const ev = events.find((e) => e.id === eventId);
        if (!ev) return;
        viewingEventId = ev.id;

        const meta = getCategoryMeta(ev.category);
        const dateObj = parseISODate(ev.date);
        const datePretty = capitalizeFirst(
          new Intl.DateTimeFormat("nl-NL", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }).format(dateObj)
        );

        document.getElementById("viewBadge").style.backgroundColor = meta.color;
        document.getElementById("viewTitle").textContent = ev.title;
        document.getElementById("viewDate").textContent = datePretty;
        document.getElementById("viewTime").textContent = ev.allDay ? "Hele dag" : ev.time || "-";
        document.getElementById("viewCategoryEmoji").textContent = meta.emoji || "🏷️";
        document.getElementById("viewCategoryName").textContent = meta.label;
        document.getElementById("viewDescription").textContent =
          ev.description || "Geen omschrijving beschikbaar.";

        openModal("eventViewModal");
      }

      function editViewingEvent() {
        if (!viewingEventId) return;
        const ev = events.find((e) => e.id === viewingEventId);
        if (!ev) return;

        closeModal("eventViewModal");
        editingEventId = ev.id;
        document.getElementById("formTitle").textContent = "Afspraak wijzigen";
        document.getElementById("eventTitle").value = ev.title;
        document.getElementById("eventDate").value = ev.date;
        document.getElementById("eventDescription").value = ev.description || "";
        document.getElementById("eventRepeat").value = "none";
        document.getElementById("eventType").value = categories[ev.category] ? ev.category : "activity";

        const allDayCheckbox = document.getElementById("allDay");
        const timeInput = document.getElementById("eventTime");
        allDayCheckbox.checked = Boolean(ev.allDay);
        timeInput.disabled = Boolean(ev.allDay);
        timeInput.value = ev.allDay ? "" : ev.time || "09:00";

        openModal("eventModal");
        setTimeout(() => document.getElementById("eventTitle")?.focus(), 40);
      }

      function completeViewingEvent() {
        if (!viewingEventId) return;
        const ev = events.find((e) => e.id === viewingEventId);
        const title = ev ? ev.title : "Afspraak";
        events = events.filter((e) => e.id !== viewingEventId);
        saveEvents();
        viewingEventId = null;
        closeModal("eventViewModal");
        renderAll();
        showMessage(`"${title}" gemarkeerd als gereed.`, "success");
      }

      function deleteViewingEvent() {
        if (!viewingEventId) return;
        const ev = events.find((e) => e.id === viewingEventId);
        const title = ev ? ev.title : "Afspraak";
        events = events.filter((e) => e.id !== viewingEventId);
        saveEvents();
        viewingEventId = null;
        closeModal("eventViewModal");
        renderAll();
        showMessage(`"${title}" verwijderd.`, "success");
      }

      function stepPeriod(delta) {
        if (currentView === "month" || currentView === "agenda") {
          anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth() + delta, 1);
        } else if (currentView === "week") {
          anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate() + delta * 7);
        } else if (currentView === "day") {
          anchorDate = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), anchorDate.getDate() + delta);
        }
        renderAll();
      }

      function setupThemeAndSeason() {
        const btn = document.getElementById("themeButton");
        const savedTheme = localStorage.getItem(STORAGE_THEME_KEY);
        if (savedTheme === "dark") {
          document.body.classList.add("dark", "dark-mode");
          if (btn) btn.textContent = "☀️";
        }

        btn?.addEventListener("click", () => {
          document.body.classList.toggle("dark");
          document.body.classList.toggle("dark-mode");
          const isDark = document.body.classList.contains("dark");
          localStorage.setItem(STORAGE_THEME_KEY, isDark ? "dark" : "light");
          if (btn) btn.textContent = isDark ? "☀️" : "🌙";
          showMessage(isDark ? "Donkere modus ingeschakeld." : "Lichte modus ingeschakeld.", "info");
        });

        const savedSeason = localStorage.getItem(STORAGE_SEASON_KEY);
        if (savedSeason && ["auto", "spring", "summer", "autumn", "winter"].includes(savedSeason)) {
          seasonPref = savedSeason;
        }
        applySeasonTheme();

        document.getElementById("seasonSelect")?.addEventListener("change", (e) => {
          seasonPref = e.target.value || "auto";
          localStorage.setItem(STORAGE_SEASON_KEY, seasonPref);
          applySeasonTheme();
          showMessage(
            seasonPref === "auto"
              ? "Seizoen ingesteld op automatisch."
              : `Seizoen gewijzigd naar ${e.target.selectedOptions[0]?.textContent || seasonPref}.`,
            "info"
          );
        });
      }

      function bindAllEvents() {
        document.getElementById("toggleSidebarBtn")?.addEventListener("click", () => {
          document.getElementById("gcalSidebar")?.classList.toggle("collapsed");
        });

        document.getElementById("brandHomeLink")?.addEventListener("click", (e) => {
          e.preventDefault();
          activeCategoryFilter = "all";
          searchQuery = "";
          const searchEl = document.getElementById("search");
          if (searchEl) searchEl.value = "";
          renderCategoryUI();
          renderAll();
          showMessage("Agenda gereset naar startweergave.", "info");
        });

        document.getElementById("gcalTodayBtn")?.addEventListener("click", () => {
          anchorDate = new Date();
          renderAll();
          showMessage("Naar vandaag gesprongen.", "info");
        });

        document.getElementById("gcalPrevBtn")?.addEventListener("click", () => stepPeriod(-1));
        document.getElementById("gcalNextBtn")?.addEventListener("click", () => stepPeriod(1));

        document.querySelectorAll(".gcal-view-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const nextView = btn.dataset.view;
            if (nextView) {
              currentView = nextView;
              renderCalendarView();
            }
          });
        });

        document.getElementById("search")?.addEventListener("input", (e) => {
          searchQuery = e.target.value || "";
          renderCalendarView();
        });

        document.getElementById("logoutButton")?.addEventListener("click", () => {
          activeCategoryFilter = "all";
          searchQuery = "";
          const searchEl = document.getElementById("search");
          if (searchEl) searchEl.value = "";
          renderCategoryUI();
          renderCalendarView();
          showMessage("Je bent uitgelogd uit deze sessie.", "info");
        });

        document.getElementById("addEventButton")?.addEventListener("click", () => {
          openFormModal(formatDateISO(anchorDate));
        });

        document.getElementById("miniPrevMonth")?.addEventListener("click", () => {
          miniCalMonth = new Date(miniCalMonth.getFullYear(), miniCalMonth.getMonth() - 1, 1);
          renderMiniCalendar();
        });

        document.getElementById("miniNextMonth")?.addEventListener("click", () => {
          miniCalMonth = new Date(miniCalMonth.getFullYear(), miniCalMonth.getMonth() + 1, 1);
          renderMiniCalendar();
        });

        document.getElementById("openCategoryModalBtn")?.addEventListener("click", openNewCategoryModal);

        document.querySelectorAll(".emoji-preset-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const emojiInput = document.getElementById("newCategoryEmoji");
            if (emojiInput) {
              emojiInput.value = btn.dataset.emoji || "⚡";
              emojiInput.focus();
            }
          });
        });

        document.getElementById("showAllCategoriesBtn")?.addEventListener("click", () => {
          activeCategoryFilter = "all";
          renderCategoryUI();
          renderCalendarView();
          showMessage("Alle categorieën worden weergegeven.", "info");
        });

        // Afspraak modal knoppen
        document.getElementById("allDay")?.addEventListener("change", updateTimeFieldState);
        document.getElementById("saveEventButton")?.addEventListener("click", saveEventFromModal);
        document.getElementById("cancelEventButton")?.addEventListener("click", () => closeModal("eventModal"));
        document.getElementById("closeFormX")?.addEventListener("click", () => closeModal("eventModal"));

        // Categorie modal knoppen
        document.getElementById("saveCategoryButton")?.addEventListener("click", saveCategoryFromModal);
        document.getElementById("cancelCategoryButton")?.addEventListener("click", () => {
          editingCategoryId = null;
          closeModal("categoryModal");
        });
        document.getElementById("closeCategoryX")?.addEventListener("click", () => {
          editingCategoryId = null;
          closeModal("categoryModal");
        });

        // Bekijk modal knoppen
        document.getElementById("editFromViewButton")?.addEventListener("click", editViewingEvent);
        document.getElementById("doneFromViewButton")?.addEventListener("click", completeViewingEvent);
        document.getElementById("deleteFromViewButton")?.addEventListener("click", deleteViewingEvent);
        document.getElementById("closeViewX")?.addEventListener("click", () => closeModal("eventViewModal"));
        document.getElementById("closeViewButton")?.addEventListener("click", () => closeModal("eventViewModal"));

        document.querySelectorAll(".modal").forEach((modal) => {
          modal.addEventListener("click", (e) => {
            if (e.target === modal) {
              if (modal.id === "categoryModal") editingCategoryId = null;
              closeModal(modal.id);
            }
          });
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            editingCategoryId = null;
            closeModal("eventModal");
            closeModal("categoryModal");
            closeModal("eventViewModal");
          }
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadCategories();
        loadEvents();
        setupThemeAndSeason();
        renderCategoryUI();
        bindAllEvents();
        renderAll();
      });
    })();
  </script>
</body>
</html>
