<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snejin Agenda</title>

    <meta name="theme-color" content="#0B57D0">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales-all.global.min.js"></script>

    <!-- Agenda script (module met automatische fallback als firebase.js niet gevonden of nog niet ingesteld is) -->
    <script type="module" src="agenda.js"></script>
</head>

<body class="gcal-body">

    <!-- Bovenste balk (stijl Google Calendar) -->
    <header class="gcal-header">
        <div class="gcal-header-left">
            <button id="toggleSidebarBtn" type="button" class="gcal-icon-btn" title="Zijbalk in- of uitklappen" aria-label="Menu">
                ☰
            </button>

            <a href="agenda.html" class="gcal-brand">
                <img src="logo.png" alt="Snejin Agenda" class="gcal-logo" onerror="this.style.display='none'">
                <span class="gcal-brand-text">Snejin Agenda</span>
            </a>

            <button id="gcalTodayBtn" type="button" class="gcal-outlined-btn">
                Vandaag
            </button>

            <div class="gcal-nav-arrows">
                <button id="gcalPrevBtn" type="button" class="gcal-icon-btn" title="Vorige periode" aria-label="Vorige">
                    ‹
                </button>
                <button id="gcalNextBtn" type="button" class="gcal-icon-btn" title="Volgende periode" aria-label="Volgende">
                    ›
                </button>
            </div>

            <h1 id="gcalCurrentTitle" class="gcal-current-title">November 2026</h1>
        </div>

        <div class="gcal-header-center">
            <div class="gcal-search-box">
                <span class="gcal-search-icon">🔍</span>
                <input
                    id="search"
                    type="search"
                    placeholder="Zoeken in Snejin Agenda..."
                    aria-label="Zoeken in Snejin Agenda"
                >
            </div>
        </div>

        <div class="gcal-header-right">
            <div class="gcal-view-switcher" role="group" aria-label="Weergave kiezen">
                <button type="button" class="gcal-view-btn" data-view="timeGridDay">Dag</button>
                <button type="button" class="gcal-view-btn" data-view="timeGridWeek">Week</button>
                <button type="button" class="gcal-view-btn active" data-view="dayGridMonth">Maand</button>
                <button type="button" class="gcal-view-btn" data-view="listWeek">Agenda</button>
            </div>

            <button id="exportIcsButton" type="button" class="gcal-subtle-btn" title="Exporteer naar .ICS">
                .ICS
            </button>
            <button id="exportJsonButton" type="button" class="gcal-subtle-btn" title="Back-up opslaan (.JSON)">
                Back-up
            </button>
            <button id="importJsonButton" type="button" class="gcal-subtle-btn" title="Back-up herstellen (.JSON)">
                Import
            </button>
            <input id="importJsonInput" type="file" accept=".json" style="display:none;">

            <button id="themeButton" type="button" class="gcal-icon-btn" title="Donkere modus" aria-label="Donkere modus">
                🌙
            </button>

            <button id="logoutButton" type="button" class="gcal-logout-btn">
                Uitloggen
            </button>
        </div>
    </header>

    <!-- Hoofdwerkruimte: Zijbalk links + Kalender rechts -->
    <div class="gcal-workspace">
        <aside id="gcalSidebar" class="gcal-sidebar">
            <!-- Maken knop zoals Google Calendar -->
            <button id="addEventButton" type="button" class="gcal-create-btn">
                <span class="gcal-plus">+</span>
                <span>Maken</span>
            </button>

            <!-- Mini-kalender / Maandoverzicht -->
            <div class="gcal-mini-cal">
                <div class="gcal-mini-header">
                    <span id="miniCalMonthLabel">November 2026</span>
                    <div class="gcal-mini-arrows">
                        <button id="miniPrevMonth" type="button" aria-label="Vorige maand">‹</button>
                        <button id="miniNextMonth" type="button" aria-label="Volgende maand">›</button>
                    </div>
                </div>
                <div class="gcal-mini-weekdays">
                    <span>M</span><span>D</span><span>W</span><span>D</span><span>V</span><span>Z</span><span>Z</span>
                </div>
                <div id="miniCalGrid" class="gcal-mini-grid"></div>
            </div>

            <!-- Mijn categorieën (aanmaken, filteren, verwijderen) -->
            <div class="gcal-sidebar-block">
                <div class="gcal-block-header">
                    <h2>Mijn categorieën</h2>
                    <button id="openCategoryModalBtn" type="button" class="gcal-mini-add-btn" title="Nieuwe categorie aanmaken">
                        + Nieuw
                    </button>
                </div>
                <ul id="categoryList" class="gcal-cat-list"></ul>
            </div>

            <!-- Overzicht & Snelacties -->
            <div class="gcal-sidebar-block">
                <h2>Overzicht &amp; Tools</h2>
                <div class="gcal-stats-row">
                    <div class="gcal-stat-card">
                        <strong id="statTotalEvents">0</strong>
                        <span>Afspraken</span>
                    </div>
                    <div class="gcal-stat-card">
                        <strong id="statUpcomingWeek">0</strong>
                        <span>Deze week</span>
                    </div>
                </div>
                <div class="gcal-quick-actions">
                    <button id="showAllCategoriesBtn" type="button" class="gcal-text-action">
                        Alle categorieën weergeven
                    </button>
                    <button id="printAgendaBtn" type="button" class="gcal-text-action">
                        🖨️ Kalender afdrukken
                    </button>
                </div>
            </div>
        </aside>

        <main class="gcal-main">
            <div class="gcal-calendar-surface">
                <div id="calendar"></div>
            </div>
        </main>
    </div>

    <!-- Modal: Afspraak aanmaken of wijzigen -->
    <div id="eventModal" class="modal" aria-hidden="true">
        <div class="modal-content gcal-dialog" role="dialog" aria-modal="true" aria-labelledby="formTitle">
            <button id="closeFormX" class="modal-close" type="button" aria-label="Sluiten">&times;</button>
            <h2 id="formTitle" class="gcal-dialog-title">Nieuwe afspraak</h2>

            <div class="gcal-form">
                <div class="gcal-field">
                    <input id="eventTitle" type="text" class="gcal-title-input" placeholder="Titel toevoegen" required>
                </div>

                <div class="gcal-row-2">
                    <div class="gcal-field">
                        <label for="eventDate">Datum</label>
                        <input id="eventDate" type="date" required>
                    </div>
                    <div class="gcal-field">
                        <label for="eventTime">Tijd</label>
                        <input id="eventTime" type="time">
                    </div>
                </div>

                <label class="gcal-check">
                    <input id="allDay" type="checkbox" checked>
                    <span>Hele dag</span>
                </label>

                <div class="gcal-row-2">
                    <div class="gcal-field">
                        <label for="eventType">Categorie</label>
                        <select id="eventType"></select>
                    </div>
                    <div class="gcal-field">
                        <label for="eventRepeat">Herhalen</label>
                        <select id="eventRepeat">
                            <option value="none">Niet herhalen</option>
                            <option value="weekly">Wekelijks (4 weken)</option>
                            <option value="monthly">Maandelijks (3 maanden)</option>
                        </select>
                    </div>
                </div>

                <div class="gcal-field">
                    <label for="eventDescription">Omschrijving / Locatie / Notities</label>
                    <textarea id="eventDescription" rows="3" placeholder="Beschrijving of locatie toevoegen..."></textarea>
                </div>
            </div>

            <div class="gcal-dialog-footer">
                <button id="cancelEventButton" type="button" class="gcal-btn-secondary">Annuleren</button>
                <button id="saveEventButton" type="button" class="gcal-btn-primary">Opslaan</button>
            </div>
        </div>
    </div>

    <!-- Modal: Categorie aanmaken -->
    <div id="categoryModal" class="modal" aria-hidden="true">
        <div class="modal-content gcal-dialog" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
            <button id="closeCategoryX" class="modal-close" type="button" aria-label="Sluiten">&times;</button>
            <h2 id="categoryModalTitle" class="gcal-dialog-title">Nieuwe categorie</h2>

            <div class="gcal-form">
                <div class="gcal-field">
                    <label for="newCategoryName">Naam</label>
                    <input id="newCategoryName" type="text" placeholder="Bijv. Sport, Werk, Familie..." required>
                </div>

                <div class="gcal-row-2">
                    <div class="gcal-field">
                        <label for="newCategoryEmoji">Pictogram</label>
                        <select id="newCategoryEmoji">
                            <option value="🟦">🟦 Blauw</option>
                            <option value="🟪">🟪 Paars</option>
                            <option value="🟧">🟧 Oranje</option>
                            <option value="⚽">⚽ Sport</option>
                            <option value="💼">💼 Werk</option>
                            <option value="🎓">🎓 School</option>
                            <option value="🏠">🏠 Thuis</option>
                            <option value="⭐">⭐ Belangrijk</option>
                        </select>
                    </div>

                    <div class="gcal-field">
                        <label for="newCategoryColor">Kleur</label>
                        <input id="newCategoryColor" type="color" value="#0B57D0">
                    </div>
                </div>
            </div>

            <div class="gcal-dialog-footer">
                <button id="cancelCategoryButton" type="button" class="gcal-btn-secondary">Annuleren</button>
                <button id="saveCategoryButton" type="button" class="gcal-btn-primary">Toevoegen</button>
            </div>
        </div>
    </div>

    <!-- Modal: Afspraak bekijken / bewerken / gereed / verwijderen -->
    <div id="eventViewModal" class="modal" aria-hidden="true">
        <div class="modal-content gcal-dialog gcal-view-card" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
            <div class="gcal-view-top-actions">
                <button id="editFromViewButton" type="button" class="gcal-icon-btn" title="Afspraak wijzigen" aria-label="Wijzigen">✏️</button>
                <button id="doneFromViewButton" type="button" class="gcal-icon-btn" title="Markeren als gereed" aria-label="Gereed">✓</button>
                <button id="deleteFromViewButton" type="button" class="gcal-icon-btn gcal-danger-icon" title="Afspraak verwijderen" aria-label="Verwijderen">🗑️</button>
                <button id="closeViewX" type="button" class="modal-close gcal-inline-close" title="Sluiten" aria-label="Sluiten">&times;</button>
            </div>

            <div class="gcal-view-header">
                <span id="viewBadge" class="gcal-color-swatch"></span>
                <div>
                    <h2 id="viewTitle" class="gcal-view-title">Afspraak</h2>
                    <p id="viewDate" class="gcal-view-sub">-</p>
                </div>
            </div>

            <div class="gcal-view-body">
                <div class="gcal-view-line">
                    <span>🕐</span>
                    <span id="viewTime">-</span>
                </div>
                <div class="gcal-view-line">
                    <span>🏷️</span>
                    <span id="viewCategoryName">-</span>
                </div>
                <div class="gcal-view-desc-box">
                    <p id="viewDescription">Geen omschrijving beschikbaar.</p>
                </div>
            </div>

            <div class="gcal-dialog-footer">
                <button id="closeViewButton" type="button" class="gcal-btn-primary">Sluiten</button>
            </div>
        </div>
    </div>

</body>

</html>
