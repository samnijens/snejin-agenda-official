<!DOCTYPE html><html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Snejin Agenda</title>

<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">

<!-- FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script type="module" src="agenda.js"></script>
</head><body class="agenda-page"><header class="topbar"><div class="logo-area">
    <img
        src="logo.png"
        class="logo-small"
        alt="Snejin Agenda logo"
    >

    <div>
        <h1>Snejin Agenda</h1>
        <span>Familieagenda</span>
    </div>
</div>

<div class="top-buttons">

    <input
        id="search"
        type="search"
        placeholder="🔍 Zoek afspraak"
        autocomplete="off"
    >

    <button
        id="themeButton"
        type="button"
        aria-label="Donkere modus"
        title="Donkere modus"
    >
        🌙
    </button>

    <button
        id="logoutButton"
        type="button"
    >
        🚪 Uitloggen
    </button>

</div>

</header><main><section class="calendar-card">

    <div id="calendar"></div>

</section>

</main><!-- NIEUWE AFSPRAAK --><button
id="addEventButton"
class="floatingButton"
type="button"
title="Nieuwe afspraak"
aria-label="Nieuwe afspraak"

«»

+

</button><!-- ======================================================
     AFSPRAAK BEKIJKEN
====================================================== --><div
    id="eventViewModal"
    class="modal"
    aria-hidden="true"
><div
    class="modal-content view-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="viewTitle"
>

    <button
        class="modal-close"
        id="closeViewX"
        type="button"
        aria-label="Sluiten"
    >
        &times;
    </button>


    <span
        class="view-badge"
        id="viewBadge"
    >
        Categorie
    </span>


    <h2 id="viewTitle">
        Afspraak
    </h2>


    <div class="view-meta">

        <div class="view-row">
            <span class="view-icon">📅</span>
            <span id="viewDate">-</span>
        </div>


        <div class="view-row">
            <span class="view-icon">⏰</span>
            <span id="viewTime">-</span>
        </div>


        <div class="view-row">
            <span class="view-icon">🏷️</span>
            <span id="viewCategoryName">-</span>
        </div>

    </div>


    <div class="view-desc">

        <h3>Omschrijving</h3>

        <p id="viewDescription">
            Geen omschrijving.
        </p>

    </div>


    <div class="modal-buttons">

        <button
            id="doneFromViewButton"
            class="btn btn-done"
            type="button"
        >
            ✅ Gedaan
        </button>


        <button
            id="editFromViewButton"
            class="btn btn-edit"
            type="button"
        >
            ✏️ Bewerken
        </button>


        <button
            id="deleteFromViewButton"
            class="btn btn-delete"
            type="button"
        >
            🗑️ Verwijderen
        </button>


        <button
            id="closeViewButton"
            class="btn btn-cancel"
            type="button"
        >
            Sluiten
        </button>

    </div>

</div>

</div><!-- ======================================================
     NIEUWE AFSPRAAK / BEWERKEN
====================================================== --><div
    id="eventModal"
    class="modal"
    aria-hidden="true"
><div
    class="modal-content form-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="formTitle"
>

    <button
        class="modal-close"
        id="closeFormX"
        type="button"
        aria-label="Sluiten"
    >
        &times;
    </button>


    <h2 id="formTitle">
        Nieuwe afspraak
    </h2>


    <div class="form-body">

        <!-- TITEL -->
        <div class="form-group">

            <label for="eventTitle">
                Naam
            </label>

            <input
                id="eventTitle"
                type="text"
                placeholder="Bijv. Tandarts"
                autocomplete="off"
            >

        </div>


        <!-- OMSCHRIJVING -->
        <div class="form-group">

            <label for="eventDescription">
                Omschrijving
            </label>

            <textarea
                id="eventDescription"
                rows="3"
                placeholder="Extra informatie..."
            ></textarea>

        </div>


        <!-- DATUM + TIJD -->
        <div class="form-row">

            <div class="form-group">

                <label for="eventDate">
                    Datum
                </label>

                <input
                    id="eventDate"
                    type="date"
                >

            </div>


            <div class="form-group">

                <label for="eventTime">
                    Tijd
                </label>

                <input
                    id="eventTime"
                    type="time"
                >

            </div>

        </div>


        <!-- CATEGORIE -->
        <div class="form-group">

            <label for="eventType">
                Categorie
            </label>

            <select id="eventType">

                <option value="work">
                    🔴 Werken
                </option>

                <option value="holiday">
                    🟢 Vakantie
                </option>

                <option value="activity" selected>
                    🟩 Activiteit
                </option>

                <option value="birthday">
                    🟠 Verjaardag
                </option>

                <option value="holidayofficial">
                    🟡 Officiële feestdag
                </option>

            </select>

        </div>


        <!-- HELE DAG -->
        <label class="checkbox-line">

            <input
                id="allDay"
                type="checkbox"
                checked
            >

            <span>
                Hele dag
            </span>

        </label>

    </div>


    <div class="modal-buttons">

        <button
            id="saveEventButton"
            class="btn btn-save"
            type="button"
        >
            💾 Opslaan
        </button>


        <button
            id="cancelEventButton"
            class="btn btn-cancel"
            type="button"
        >
            Annuleren
        </button>

    </div>

</div>

</div><!-- ======================================================
     JAVASCRIPT
====================================================== --><script type="module" src="agenda.js"></script></body>
</html>
